name: cadence

services:
    db:
        image: mariadb:11.4
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    backend:
        container_name: cadence-backend
        build: 
            context: ./Backend
            dockerfile: Dockerfile
        working_dir: /app
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: development
            HOST: 0.0.0.0
            PORT: "3000"
            DB_HOST: db
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - ./Backend:/app
            - /app/node_modules
        depends_on:
            db:
                condition: service_healthy

    frontend:
        container_name: cadence-frontend
        build: 
            context: ./Frontend
            dockerfile: Dockerfile
        working_dir: /app
        environment:
            VITE_API_URL: http://localhost:3000
        ports:
            - "5173:5173"
        depends_on:
            - backend
        volumes:
            - ./Frontend:/app
            - /app/node_modules
    
volumes:
    db_data: